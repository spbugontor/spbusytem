<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Pemesanan LPG Unida</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
        }
        .login-box {
            width: 90%; max-width: 400px;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box glass animate-fade-in">
        <h1 style="margin-bottom: 5px;">Login LPG</h1>
        <p style="color: var(--text-muted); margin-bottom: 25px; font-size: 0.9rem;">Masukkan Nomor WA dan PIN Anda</p>
        
        <form id="loginForm">
            <div class="form-group" style="text-align: left;">
                <label>Nomor WhatsApp</label>
                <input type="tel" id="waInput" required placeholder="081234567890">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>PIN (6 Angka)</label>
                <input type="password" id="pinInput" required maxlength="6">
            </div>
            <div id="loginMsg" style="margin-bottom: 15px; font-size: 0.85rem;"></div>
            <button type="submit" class="btn">Masuk</button>
        </form>
    </div>

    <script type="module" src="js/app.js"></script>
    <script>
        window.initApp = function() {
            // Already logged in?
            const u = window.getUser();
            if (u) {
                window.location.href = (u.role === 'admin') ? 'admin.html' : 'customer.html';
            }
        };

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const wa = document.getElementById('waInput').value;
            const pin = document.getElementById('pinInput').value;
            const msg = document.getElementById('loginMsg');
            
            // Bypass khusus admin tanpa DB sementara, atau gunakan DB
            if (wa === 'admin') {
                const adminPin = await window.dbApi.getAdminPin();
                if (pin === adminPin) {
                    window.setUser({ id: 'admin', name: 'Admin Pusat', role: 'admin' });
                    window.location.href = 'admin.html';
                    return;
                }
            }

            try {
                msg.className = ""; msg.innerText = "Mengecek...";
                const res = await window.apiCall('/login', 'POST', { wa_number: wa, pin });
                window.setUser(res.user);
                window.location.href = (res.user.role === 'admin') ? 'admin.html' : 'customer.html';
            } catch (err) {
                msg.className = "text-danger"; msg.innerText = err.message;
            }
        });
    </script>
</body>
</html>
