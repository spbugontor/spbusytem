<!DOCTYPE html>
<html lang="id" data-theme="blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LPG UNIDA Gontor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="auth-wrapper">
        
        <!-- LOGIN TABS -->
        <div class="auth-card glass animate-fade-in" id="loginSection">
            <h1>LPG UNIDA</h1>
            <p>Silakan masuk ke akun Anda</p>
            
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="btn" id="tabPelanggan" style="flex: 1;">Pelanggan</button>
                <button class="btn btn-secondary" id="tabAdmin" style="flex: 1;">Admin</button>
            </div>

            <!-- LOGIN PELANGGAN -->
            <form id="loginPelangganForm">
                <div class="form-group">
                    <label>Nomor WhatsApp</label>
                    <input type="text" id="loginName" required placeholder="08xxxxxxxxxx">
                </div>
                <div class="form-group">
                    <label>PIN (6 Digit)</label>
                    <input type="password" id="loginPin" required maxlength="6" pattern="[0-9]{6}" placeholder="******">
                </div>
                <div id="loginError" class="text-danger" style="font-size: 0.85rem; margin-bottom: 15px;"></div>
                <button type="submit" class="btn">Masuk Pelanggan</button>
            </form>

            <!-- LOGIN ADMIN -->
            <form id="loginAdminForm" class="hidden">
                <div class="form-group">
                    <label>PIN Admin Khusus</label>
                    <input type="password" id="adminPin" required maxlength="6" pattern="[0-9]{6}" placeholder="Masukkan PIN Admin">
                </div>
                <div id="adminError" class="text-danger" style="font-size: 0.85rem; margin-bottom: 15px;"></div>
                <button type="submit" class="btn">Masuk Admin</button>
            </form>
            
            <div style="margin-top: 20px; font-size: 0.9rem;" id="registerLinkDiv">
                Belum punya akun? <a href="#" id="showRegister" style="color: var(--primary); font-weight: 600;">Daftar Sekarang</a>
            </div>
        </div>

        <!-- REGISTER SECTION -->
        <div class="auth-card glass animate-fade-in hidden" id="registerSection">
            <h1>Daftar Akun Baru</h1>
            <p>Khusus Keluarga Pondok UNIDA Gontor</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label>Nama Keluarga</label>
                    <input type="text" id="regName" required placeholder="Contoh: Keluarga Budi">
                </div>
                <div class="form-group">
                    <label>Nomor WhatsApp</label>
                    <input type="tel" id="regWa" required placeholder="08xxxxxxxxxx">
                </div>
                <div class="form-group">
                    <label>Lokasi Penurunan</label>
                    <select id="regLocation" required>
                        <option value="">Pilih Lokasi...</option>
                        <!-- Options akan dimuat lewat JS -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Buat PIN (6 Angka)</label>
                    <input type="password" id="regPin" required maxlength="6" pattern="[0-9]{6}" placeholder="******">
                </div>
                
                <div id="regMsg" style="font-size: 0.85rem; margin-bottom: 15px;"></div>
                
                <button type="submit" class="btn">Daftar Sekarang</button>
                <button type="button" class="btn btn-secondary" id="showLogin">Batal & Kembali</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script>
        window.initApp = function() {
            // Already logged in?
            const u = window.getUser();
            if (u) {
                window.location.href = (u.role === 'admin') ? 'admin.html' : 'customer.html';
            }
            loadLocationsForSelect('regLocation');
        };

        // UI Logic untuk Auth Page
        document.getElementById('showRegister').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('registerSection').classList.remove('hidden');
        });

        document.getElementById('showLogin').addEventListener('click', () => {
            document.getElementById('registerSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        });

        
        // Tab Logic
        document.getElementById('tabPelanggan').addEventListener('click', () => {
            document.getElementById('tabPelanggan').className = 'btn';
            document.getElementById('tabAdmin').className = 'btn btn-secondary';
            document.getElementById('loginPelangganForm').classList.remove('hidden');
            document.getElementById('loginAdminForm').classList.add('hidden');
            document.getElementById('registerLinkDiv').classList.remove('hidden');
        });
        document.getElementById('tabAdmin').addEventListener('click', () => {
            document.getElementById('tabAdmin').className = 'btn';
            document.getElementById('tabPelanggan').className = 'btn btn-secondary';
            document.getElementById('loginAdminForm').classList.remove('hidden');
            document.getElementById('loginPelangganForm').classList.add('hidden');
            document.getElementById('registerLinkDiv').classList.add('hidden');
        });

        // Login Pelanggan
        document.getElementById('loginPelangganForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const wa_number = document.getElementById('loginName').value;
            const pin = document.getElementById('loginPin').value;
            const errDiv = document.getElementById('loginError');
            
            try {
                errDiv.innerText = "Memproses...";
                const res = await window.apiCall('/login', 'POST', { wa_number, pin });
                window.setUser(res.user);
                window.location.href = 'customer.html';
            } catch(err) {
                errDiv.innerText = err.message;
            }
        });

        // Login Admin
        document.getElementById('loginAdminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pin = document.getElementById('adminPin').value;
            const errDiv = document.getElementById('adminError');
            
            if (pin === '901926') {
                window.setUser({ id: 'admin', name: 'Admin Pusat', role: 'admin' });
                window.location.href = 'admin.html';
            } else {
                errDiv.innerText = 'PIN Admin Salah!';
            }
        });

        // Register Logic
        const regForm = document.getElementById('registerForm');
        if(regForm) {
            regForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('regName').value;
                const wa_number = document.getElementById('regWa').value;
                const location_id = document.getElementById('regLocation').value;
                const pin = document.getElementById('regPin').value;
                const msgDiv = document.getElementById('regMsg');

                try {
                    msgDiv.className = ""; msgDiv.innerText = "Mendaftarkan...";
                    await window.apiCall('/register', 'POST', { name, wa_number, location_id, pin });
                    msgDiv.className = "text-success"; 
                    msgDiv.innerText = "Pendaftaran berhasil! Silakan kembali ke halaman Login.";
                    regForm.reset();
                } catch(err) {
                    msgDiv.className = "text-danger"; msgDiv.innerText = err.message;
                }
            });
        }

        async function loadLocationsForSelect(selectId) {
            try {
                const locs = await window.apiCall('/locations');
                const sel = document.getElementById(selectId);
                sel.innerHTML = '<option value="">Pilih Lokasi...</option>';
                locs.forEach(l => {
                    sel.innerHTML += `<option value="${l.id}">${l.name}</option>`;
                });
            } catch(e) {}
        }
        
        </script>
</body>
</html>
